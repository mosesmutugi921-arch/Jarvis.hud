name: Build APK
on: [push]
jobs:
  build:
    runs-on: ubuntu-22.04
    steps:
      - uses: actions/checkout@v4
      - name: Build with Buildozer
        uses: RICHIH/buildozer-action@v1
        id: buildozer
        with:
          command: buildozer -v android debug
      - name: Upload APK Artifact
        uses: actions/upload-artifact@v4
        with:
          name: jarvis-package
          path: bin/*.apk
          
          
          
          
